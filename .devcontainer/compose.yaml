services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - node_modules:/home/vscode/app/node_modules
      - ../:/home/vscode/app:cached
    environment:
      NODE_ENV: development
      NODE_OPTIONS: "--no-deprecation"
    tty: true
    stdin_open: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:8.6.3
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  postgres:
    image: postgres:17.9
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ccr
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates the ccr_test DB on a fresh volume so `bun test` doesn't
      # need to TRUNCATE the dev `ccr` database. Existing volumes need
      # `createdb -U postgres ccr_test` once by hand.
      - ./postgres-initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ccr"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  node_modules:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
