<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rialto — Providers</title>
<link rel="stylesheet" href="../node_modules/@fontsource-variable/inter/index.css">
<link rel="stylesheet" href="../node_modules/@fontsource-variable/geist-mono/index.css">
<link rel="stylesheet" href="../node_modules/remixicon/fonts/remixicon.css">
<link rel="stylesheet" href="_shared/mock.build.css">
<script src="_shared/shell.js"></script>
</head>
<body>
<div id="root"></div>
<script>
const { renderShell, pill, meter, btn } = window.Shell

// Providers / Subscriptions / Models / Transformers were four separate
// screens. They are one thing — "where requests can go" — so they become
// one master-detail screen: pick a provider on the left, configure its
// models on the right.
const PROVIDERS = [
  { id: 'claude-code', label: 'Claude Code', vendor: 'Anthropic', auth: 'subscription', plan: 'Max', models: '6 / 7', quota: 71, state: 'live',    active: true },
  { id: 'codex',       label: 'Codex',       vendor: 'OpenAI',    auth: 'subscription', plan: 'Pro', models: '1 / 4', quota: 88, state: 'live',    active: false },
  { id: 'gemini-cli',  label: 'Gemini CLI',  vendor: 'Google',    auth: 'subscription', plan: 'AI Pro', models: '3 / 5', quota: 12, state: 'invalid', active: false },
  { id: 'anthropic',   label: 'Anthropic',   vendor: 'Anthropic', auth: 'api_key', plan: null, models: '4 / 12', quota: null, state: 'live', active: false },
  { id: 'openai',      label: 'OpenAI',      vendor: 'OpenAI',    auth: 'api_key', plan: null, models: '5 / 18', quota: null, state: 'live', active: false },
  { id: 'google',      label: 'Google',      vendor: 'Google',    auth: 'api_key', plan: null, models: '4 / 9',  quota: null, state: 'live', active: false },
  { id: 'deepseek',    label: 'DeepSeek',    vendor: 'DeepSeek',  auth: 'api_key', plan: null, models: '0 / 3',  quota: null, state: 'unknown', active: false }
]

const stateTone = { live: 'ok', invalid: 'bad', unknown: 'mute' }

const providerRow = (p) => `
  <button class="block w-full border-l-2 px-4 py-3 text-left transition-colors ${
    p.active ? 'border-l-foreground bg-muted/60' : 'border-l-transparent hover:border-l-border hover:bg-muted/50'
  }">
    <div class="flex items-center gap-2">
      <span class="text-xs font-medium">${p.label}</span>
      ${p.plan ? pill(p.plan, 'info') : ''}
      <span class="ml-auto font-mono text-[11px] tabular-nums text-muted-foreground">${p.models}</span>
    </div>
    <div class="mt-1 flex items-center gap-2 text-[11px] text-muted-foreground">
      <span>${p.auth === 'subscription' ? 'OAuth' : 'API key'}</span>
      <span class="opacity-40">·</span>
      <span>${p.vendor}</span>
      <span class="ml-auto">${pill(p.state, stateTone[p.state])}</span>
    </div>
    ${p.quota === null ? '' : `<div class="mt-2">${meter(p.quota)}</div>`}
  </button>`

// ─── Model table for the selected provider ────────────────────────────
// Prices stay in separate columns (in / cached / out) — one packed
// "$3/$0.30/$15" cell is unreadable and unsortable.
const MODELS = [
  { name: 'claude-fable-5',    tier: 'fable',  ctx: '500k', inp: '—', cache: '—', out: '—', test: 'ok',      on: true },
  { name: 'claude-opus-4-8',   tier: 'opus',   ctx: '200k', inp: '—', cache: '—', out: '—', test: 'ok',      on: true },
  { name: 'claude-opus-4-7',   tier: 'opus',   ctx: '200k', inp: '—', cache: '—', out: '—', test: 'ok',      on: true },
  { name: 'claude-sonnet-5',   tier: 'sonnet', ctx: '1M',   inp: '—', cache: '—', out: '—', test: 'ok',      on: true },
  { name: 'claude-sonnet-4-6', tier: 'sonnet', ctx: '1M',   inp: '—', cache: '—', out: '—', test: 'ok',      on: true },
  { name: 'claude-haiku-4-5',  tier: 'haiku',  ctx: '200k', inp: '—', cache: '—', out: '—', test: 'fail',    on: true },
  { name: 'claude-mythos-5',   tier: 'fable',  ctx: '500k', inp: '—', cache: '—', out: '—', test: 'unknown', on: false }
]

const testIcon = { ok: '<i class="ri-check-line text-emerald-600 dark:text-emerald-400"></i>', fail: '<i class="ri-close-line text-destructive"></i>', unknown: '<i class="ri-subtract-line text-muted-foreground/50"></i>' }

const modelRow = (m) => `
  <tr class="border-t border-border/60 transition-colors hover:bg-muted/50 ${m.on ? '' : 'opacity-45'}">
    <td class="py-2.5 pl-6 pr-2 font-mono text-xs">${m.name}</td>
    <td class="px-2">${pill(m.tier, 'mute')}</td>
    <td class="px-2 text-right font-mono text-xs tabular-nums text-muted-foreground">${m.ctx}</td>
    <td class="px-2 text-right font-mono text-xs tabular-nums text-muted-foreground">${m.inp}</td>
    <td class="px-2 text-right font-mono text-xs tabular-nums text-muted-foreground">${m.cache}</td>
    <td class="px-2 text-right font-mono text-xs tabular-nums text-muted-foreground">${m.out}</td>
    <td class="px-2 text-center text-sm leading-none">${testIcon[m.test]}</td>
    <td class="py-2.5 pl-2 pr-6 text-right">
      <span class="inline-flex h-4 w-7 items-center rounded-full ${m.on ? 'bg-foreground' : 'bg-muted-foreground/30'} px-0.5 align-middle">
        <span class="size-3 rounded-full bg-background ${m.on ? 'translate-x-3' : ''}"></span>
      </span>
    </td>
  </tr>`

const models = `
  <table class="w-full table-fixed">
    <colgroup><col><col class="w-20"><col class="w-20"><col class="w-20"><col class="w-20"><col class="w-20"><col class="w-16"><col class="w-20"></colgroup>
    <thead>
      <tr class="text-[11px] uppercase tracking-wider text-muted-foreground/70 [&>th]:pb-2">
        <th class="pl-6 pr-2 text-left font-medium">Model</th>
        <th class="px-2 text-left font-medium">Tier</th>
        <th class="px-2 text-right font-medium">Context</th>
        <th class="px-2 text-right font-medium">In /1M</th>
        <th class="px-2 text-right font-medium">Cached</th>
        <th class="px-2 text-right font-medium">Out /1M</th>
        <th class="px-2 text-center font-medium">Test</th>
        <th class="pl-2 pr-6 text-right font-medium">On</th>
      </tr>
    </thead>
    <tbody>${MODELS.map(modelRow).join('')}</tbody>
  </table>`

const ACCOUNTS = [
  { label: 'tkgstrator@…', plan: 'Max', active: true,  auth: 'live',    used: 71, resets: '3d 04h' },
  { label: 'second@…',     plan: 'Pro', active: false, auth: 'live',    used: 22, resets: '3d 04h' }
]

const accountRow = (a) => `
  <div class="border-l-2 ${a.active ? 'border-l-foreground' : 'border-l-transparent'} px-4 py-3 transition-colors hover:bg-muted/50">
    <div class="flex items-center gap-2">
      <span class="text-xs font-medium">${a.label}</span>
      ${pill(a.plan, 'info')}
      ${a.active ? pill('active', 'ok') : ''}
      <span class="ml-auto font-mono text-[11px] tabular-nums">${a.used}%</span>
    </div>
    <div class="mt-2">${meter(a.used)}</div>
    <div class="mt-1.5 flex items-center gap-2 text-[11px] text-muted-foreground">
      <span>auth ${a.auth}</span><span class="opacity-40">·</span><span>weekly resets in ${a.resets}</span>
    </div>
  </div>`

document.getElementById('root').innerHTML = `
  <div class="grid h-full grid-cols-[18rem_1fr]">

    <aside class="min-w-0 overflow-y-auto border-r border-border">
      <div class="flex items-center gap-2 px-4 pt-5 pb-2">
        <h2 class="text-xs font-semibold uppercase tracking-wider text-muted-foreground">Subscriptions</h2>
        <span class="ml-auto font-mono text-[10px] text-muted-foreground">3</span>
      </div>
      ${PROVIDERS.filter((p) => p.auth === 'subscription').map(providerRow).join('')}

      <div class="mt-2 flex items-center gap-2 border-t border-border px-4 pt-5 pb-2">
        <h2 class="text-xs font-semibold uppercase tracking-wider text-muted-foreground">API keys</h2>
        <span class="ml-auto font-mono text-[10px] text-muted-foreground">4</span>
      </div>
      ${PROVIDERS.filter((p) => p.auth === 'api_key').map(providerRow).join('')}

      <div class="p-4">
        ${btn('Add provider', 'outline', 'ri-add-line')}
      </div>
    </aside>

    <div class="min-w-0 overflow-y-auto">
      <div class="flex items-center gap-3 border-b border-border px-6 py-4">
        <div>
          <div class="flex items-center gap-2">
            <h2 class="text-sm font-semibold">Claude Code</h2>
            ${pill('subscription', 'info')}
            ${pill('live', 'ok')}
          </div>
          <p class="mt-0.5 font-mono text-[11px] text-muted-foreground">https://api.anthropic.com/v1/messages</p>
        </div>
        <div class="ml-auto flex gap-2">
          ${btn('Test all', 'outline', 'ri-pulse-line')}
          ${btn('Sync models', 'ghost', 'ri-refresh-line')}
        </div>
      </div>

      <div class="grid grid-cols-2 border-b border-border">
        <div class="border-r border-border">
          <div class="px-6 pt-5 pb-2">
            <h3 class="text-xs font-semibold uppercase tracking-wider text-muted-foreground">Accounts</h3>
          </div>
          <div class="px-2 pb-4">${ACCOUNTS.map(accountRow).join('')}</div>
        </div>
        <!-- Read-only. There is nothing to pick here: the wire shape is a
             function of apiStyle + authMode, and all six registered
             transformers are endpoint- or auth-bound. Shown because
             "what does this provider actually speak" is worth seeing
             when a request misbehaves. -->
        <div>
          <div class="px-6 pt-5 pb-2">
            <h3 class="text-xs font-semibold uppercase tracking-wider text-muted-foreground">Request shape</h3>
          </div>
          <div class="px-6 pb-4">
            <div class="flex items-baseline gap-3 border-l-2 border-l-transparent py-1.5 transition-colors hover:border-l-border">
              <span class="text-[11px] text-muted-foreground">API style</span>
              <span class="ml-auto font-mono text-[11px]">anthropic</span>
            </div>
            <div class="flex items-baseline gap-3 border-l-2 border-l-transparent py-1.5 transition-colors hover:border-l-border">
              <span class="text-[11px] text-muted-foreground">Auth</span>
              <span class="ml-auto font-mono text-[11px]">subscription (OAuth)</span>
            </div>
            <div class="flex items-baseline gap-3 border-l-2 border-l-transparent py-1.5 transition-colors hover:border-l-border">
              <span class="text-[11px] text-muted-foreground">Pipeline</span>
              <span class="ml-auto font-mono text-[11px]">claude-code-oauth</span>
            </div>
            <div class="flex items-baseline gap-3 border-l-2 border-l-transparent py-1.5 transition-colors hover:border-l-border">
              <span class="text-[11px] text-muted-foreground">Endpoint</span>
              <span class="ml-auto font-mono text-[11px]">/v1/messages</span>
            </div>
            <p class="mt-3 text-[11px] leading-relaxed text-muted-foreground">
              Derived from the API style — not configurable. Per-model overrides live in the
              model row below.
            </p>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-3 px-6 pt-5 pb-3">
        <h3 class="text-xs font-semibold uppercase tracking-wider text-muted-foreground">Models</h3>
        <span class="text-[11px] text-muted-foreground">6 of 7 enabled</span>
        <div class="ml-auto flex items-center gap-2">
          <div class="flex h-7 items-center gap-2 rounded-md border border-border px-2.5 text-xs text-muted-foreground">
            <i class="ri-search-line text-sm"></i> Filter
          </div>
        </div>
      </div>
      ${models}
      <div class="h-8"></div>
    </div>

  </div>`

renderShell({
  active: 'providers',
  title: 'Providers',
  subtitle: '7 providers · 23 models enabled · 3 subscription accounts',
  actions: btn('Refresh prices', 'ghost', 'ri-price-tag-3-line') + btn('Add provider', 'primary', 'ri-add-line')
})
</script>
</body>
</html>
