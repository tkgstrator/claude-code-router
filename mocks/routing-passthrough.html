<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rialto — Routing (passthrough)</title>
<link rel="stylesheet" href="../node_modules/@fontsource-variable/inter/index.css">
<link rel="stylesheet" href="../node_modules/@fontsource-variable/geist-mono/index.css">
<link rel="stylesheet" href="../node_modules/remixicon/fonts/remixicon.css">
<link rel="stylesheet" href="_shared/mock.build.css">
<script src="_shared/shell.js"></script>
</head>
<body>
<div id="root"></div>
<script>
const { renderShell, pill, btn } = window.Shell

// The other half of the Routing screen: what a surface looks like when
// the router does NOT apply. This is today's hardcoded behaviour for
// /v1/responses and /v1/chat/completions (scenario-router.ts:117-128),
// made visible and reversible instead of silent.
const SURFACES = [
  { id: 'messages',  label: '/v1/messages',         mode: 'routed',      hint: 'Claude Code' },
  { id: 'chat',      label: '/v1/chat/completions', mode: 'routed',      hint: 'OpenAI SDK' },
  { id: 'responses', label: '/v1/responses',        mode: 'passthrough', hint: 'Codex CLI' },
  { id: 'gemini',    label: '/v1beta/models/*',     mode: 'passthrough', hint: 'Gemini CLI' }
]
const ACTIVE_SURFACE = 'responses'

const surfaceTab = (s) => {
  const on = s.id === ACTIVE_SURFACE
  return `
    <button class="relative flex flex-col items-start gap-0.5 border-b-2 px-4 py-2.5 text-left transition-colors ${
      on ? 'border-b-foreground' : 'border-b-transparent hover:bg-muted/50'
    }">
      <span class="font-mono text-xs ${on ? 'text-foreground' : 'text-muted-foreground'}">${s.label}</span>
      <span class="flex items-center gap-1.5 text-[11px] text-muted-foreground">
        ${s.hint} · ${s.mode === 'routed' ? '<span class="text-emerald-600 dark:text-emerald-400">routed</span>' : 'passthrough'}
      </span>
    </button>`
}

// In passthrough the only thing that matters is which "provider,model"
// strings a caller may send. Showing the reachable set is the useful
// content here — the chain editor would be misleading.
const REACHABLE = [
  { target: 'codex,gpt-5.5',                  tier: 'opus',   state: 'ready' },
  { target: 'codex,gpt-5.4',                  tier: 'sonnet', state: 'ready' },
  { target: 'openai,gpt-5.5',                 tier: 'opus',   state: 'ready' },
  { target: 'openai,gpt-5.4-mini',            tier: 'haiku',  state: 'ready' },
  { target: 'openai,gpt-5.3-codex',           tier: 'opus',   state: 'ready' }
]

const row = (e) => `
  <tr class="border-t border-border/60 transition-colors hover:bg-muted/50">
    <td class="py-2.5 pl-6 pr-2 font-mono text-xs">${e.target}</td>
    <td class="px-2">${pill(e.tier, 'mute')}</td>
    <td class="px-2">${pill(e.state, 'ok')}</td>
    <td class="py-2.5 pl-2 pr-6 text-right">
      <button class="text-muted-foreground/60 hover:text-foreground"><i class="ri-file-copy-line text-sm"></i></button>
    </td>
  </tr>`

document.getElementById('root').innerHTML = `
  <div class="flex items-stretch gap-0 border-b border-border px-2">
    ${SURFACES.map(surfaceTab).join('')}
  </div>

  <div class="flex items-center gap-4 border-b border-border bg-muted/30 px-6 py-3">
    <div class="flex items-center gap-2">
      <span class="text-xs text-muted-foreground">Routing</span>
      <div class="flex rounded-md border border-border p-0.5">
        <button class="rounded px-2.5 py-1 text-[11px] text-muted-foreground hover:text-foreground">Routed</button>
        <button class="rounded bg-foreground px-2.5 py-1 text-[11px] font-medium text-background">Passthrough</button>
      </div>
    </div>
    <p class="ml-auto max-w-md text-right text-[11px] leading-snug text-muted-foreground">
      The caller's <span class="font-mono">provider,model</span> goes upstream unchanged.
      Scenarios, rules, quota-aware selection and failover are all skipped.
    </p>
  </div>

  <div class="px-6 py-5">
    <div class="rounded-md border border-amber-500/30 bg-amber-500/5 px-4 py-3">
      <div class="flex items-center gap-2">
        <i class="ri-information-line text-sm text-amber-600 dark:text-amber-400"></i>
        <span class="text-xs font-medium">This was the only behaviour before v3.0.0</span>
      </div>
      <p class="mt-1.5 text-[11px] leading-relaxed text-muted-foreground">
        Passthrough was hardcoded for <span class="font-mono">/v1/chat/completions</span> and
        <span class="font-mono">/v1/responses</span>, with nothing in the UI to say so — which is why
        every routing screen looked like it only applied to <span class="font-mono">/v1/messages</span>.
        It is now a per-surface switch, defaulting to the old behaviour so nothing changes on upgrade.
      </p>
    </div>
  </div>

  <div class="flex items-center gap-3 px-6 pb-3">
    <h2 class="text-xs font-semibold uppercase tracking-wider text-muted-foreground">Reachable targets</h2>
    <span class="text-[11px] text-muted-foreground">what a caller may put in <span class="font-mono">body.model</span></span>
    <div class="ml-auto">${btn('Copy as list', 'outline', 'ri-file-copy-line')}</div>
  </div>

  <table class="w-full table-fixed">
    <colgroup><col><col class="w-24"><col class="w-24"><col class="w-16"></colgroup>
    <thead>
      <tr class="text-[11px] uppercase tracking-wider text-muted-foreground/70">
        <th class="pb-2 pl-6 pr-2 text-left font-medium">Target</th>
        <th class="px-2 text-left font-medium">Tier</th>
        <th class="px-2 text-left font-medium">State</th>
        <th class="pb-2 pl-2 pr-6"></th>
      </tr>
    </thead>
    <tbody>${REACHABLE.map(row).join('')}</tbody>
  </table>

  <div class="px-6 py-5">
    <div class="rounded-md border border-dashed border-border px-4 py-3 text-[11px] leading-relaxed text-muted-foreground">
      <i class="ri-lightbulb-line mr-1 align-[-1px]"></i>
      Switch this surface to <span class="font-mono">Routed</span> to give Codex CLI the same
      quota-aware failover Claude Code gets. Callers keep sending their own model string — it
      becomes the <span class="font-mono">requestedModel</span> that rules match on, rather than the
      final target.
    </div>
  </div>
  <div class="h-8"></div>`

renderShell({
  active: 'routing',
  title: 'Routing',
  subtitle: '/v1/responses · passthrough',
  actions: btn('Live map', 'outline', 'ri-node-tree') + btn('Simulate', 'ghost', 'ri-play-line')
})
</script>
</body>
</html>
