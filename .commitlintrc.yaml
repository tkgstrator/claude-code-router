---
extends:
  - "@commitlint/config-conventional"
rules:
  header-max-length:
    - 2
    - always
    - 96
  body-max-line-length:
    - 2
    - always
    - 200
  # The Co-Authored-By trailer trips this rule when the commit body
  # contains content that commitlint mis-parses as a footer (e.g.
  # `host.docker.internal:5432`). The trailer itself is intentional and
  # adding extra blank lines doesn't reliably fix the parse, so demote
  # the warning to disabled.
  footer-leading-blank:
    - 0
  # Acronyms in subjects (README, CLAUDE.md, Postgres) are common and
  # readable. Disable the case rule so e.g. "docs: README and CLAUDE.md
  # cover Postgres-backed config store" passes.
  subject-case:
    - 0
  type-enum:
    - 2
    - always
    - - build
      - ci
      - chore
      - docs
      - feat
      - fix
      - perf
      - refactor
      - revert
      - style
      - test
