---
extends:
  - "@commitlint/config-conventional"
rules:
  header-max-length:
    - 2
    - always
    - 128
  body-max-line-length:
    - 2
    - always
    - 200
  type-enum:
    - 2
    - always
    - - build
      - ci
      - chore
      - docs
      - feat
      - fix
      - perf
      - refactor
      - revert
      - style
      - test
