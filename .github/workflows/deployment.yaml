name: Deployment (develop)

on:
  push:
    branches:
      - develop
  workflow_dispatch:

# Only the latest develop push publishes the moving :develop tag.
# Older overlapping runs are cancelled so they cannot race and
# overwrite :develop with an older commit on completion.
concurrency:
  group: deployment-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_IMAGE: tkgling/rialto

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # actions:write is needed for type=gha BuildKit cache-to;
    # contents:read for checkout. Docker Hub login uses username/password
    # secrets, so packages:write and id-token:write are not required.
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=develop
            type=sha,prefix=develop-,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo ${{ steps.meta.outputs.digest }}
