name: Back-merge

# リリース (master 宛て PR) がマージされた後、master に取り込まれた変更を
# develop へ戻す。以前は qtmleap/actions の再利用 workflow で
# `git push origin master:develop` を試みていたが、develop のブランチ保護
# (PR 必須 + required status checks) が push を拒否するため、リリースの
# たびに backmerge が失敗し master と develop が乖離していた
# (docs/plan/develop-master-divergence.md 参照)。
#
# 修正版はブランチ保護と戦わず、backmerge 用のブランチを作って
# `develop` 宛ての PR を自動発行する。人間の承認 + 通常の CI を通した上で
# マージされるので、保護ルールをすり抜ける必要がない。conflict がある
# 場合は PR 化せず Issue を立てて手動介入を促す。
#
# 手動再実行: workflow_dispatch でいつでも叩ける。既に backmerge ブランチが
# 存在する場合はスキップして重複 PR を防ぐ。

on:
  pull_request:
    branches: [master]
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  backmerge:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Use default GITHUB_TOKEN — the auto-generated token can open PRs
          # via gh CLI without any secret. We DON'T need to push to develop
          # directly (that's what the old flow did and it failed), so no
          # elevated PAT is required.

      - name: Configure git identity
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"

      - name: Check whether develop needs a backmerge
        id: needed
        run: |
          git fetch origin master develop
          if git merge-base --is-ancestor origin/master origin/develop; then
            echo "develop already contains master — nothing to backmerge"
            echo "needed=false" >> "$GITHUB_OUTPUT"
          elif git diff --quiet origin/master origin/develop; then
            # History differs but every tracked file is byte-identical.
            # This is the normal state after a release: develop is squash-
            # merged into master, so master gains commits develop never
            # sees while the trees stay the same.
            #
            # Opening a PR for that is worse than useless. GitHub does not
            # start workflow runs for pull requests opened with
            # GITHUB_TOKEN, so the required status checks never report and
            # branch protection blocks the PR permanently. Eleven such PRs
            # accumulated before anyone noticed they could not be merged.
            #
            # An empty-diff divergence is cosmetic — it costs nothing to
            # leave in place — so skip instead of queueing another one.
            echo "master and develop are already content-identical — skipping"
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create backmerge branch
        if: steps.needed.outputs.needed == 'true'
        id: branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          MASTER_SHA=$(git rev-parse --short origin/master)
          BRANCH="chore/backmerge-master-${MASTER_SHA}"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

          # Idempotency: if the branch already exists on the remote, another
          # backmerge run already opened a PR for this master SHA. Skip so
          # we don't duplicate PRs.
          if git ls-remote --exit-code --heads origin "${BRANCH}" >/dev/null 2>&1; then
            echo "Branch ${BRANCH} already exists on origin — skipping (existing backmerge PR should be open)"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git checkout -B "${BRANCH}" origin/develop
          if git merge --no-ff origin/master -m "chore: backmerge master (${MASTER_SHA}) into develop"; then
            git push origin "${BRANCH}"
            echo "created=true" >> "$GITHUB_OUTPUT"
          else
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            echo "created=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open backmerge PR
        if: steps.branch.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base develop \
            --head "${{ steps.branch.outputs.branch }}" \
            --title "chore: backmerge master into develop" \
            --body "$(cat <<'EOF'
          ## What / Why

          Automated backmerge from `master` to `develop` — brings the release commit(s) that just landed on master back into develop so the two branches stay in sync.

          Created by `.github/workflows/backmerge.yaml` after a release PR merged into `master`. Rewritten to open a PR instead of pushing directly, because branch protection on `develop` (PR required + status checks) rejects direct pushes. See `docs/plan/develop-master-divergence.md` for the history.

          ## What to do

          > [!IMPORTANT]
          > CI does **not** start by itself on this PR. GitHub suppresses workflow runs for pull
          > requests opened with `GITHUB_TOKEN`, so the required status checks never report and
          > branch protection reports the PR as blocked.
          >
          > To start them, a maintainer must **close and reopen this PR** — a `reopened` event from
          > a human account does trigger CI — or push any commit to the branch. Merge once green.

          - If you see conflicts here, resolve them and push to this branch. The next release cycle will keep working once develop tracks master again.

          🤖 Generated by [backmerge workflow](../actions/workflows/backmerge.yaml)
          EOF
          )"

      - name: Open conflict tracking issue
        if: steps.branch.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "backmerge: conflict merging master into develop" \
            --body "$(cat <<EOF
          Automated backmerge from master to develop hit merge conflicts and could not be pushed automatically.

          - Master SHA: \`$(git rev-parse origin/master)\`
          - Develop SHA: \`$(git rev-parse origin/develop)\`
          - Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          ## What to do

          Resolve locally:

          \`\`\`
          git fetch origin
          git switch -c chore/backmerge-master-manual origin/develop
          git merge origin/master
          # resolve conflicts, commit, push
          git push origin HEAD
          gh pr create --base develop --head chore/backmerge-master-manual --title 'chore: backmerge master into develop'
          \`\`\`

          Close this issue once the reconciliation PR merges.
          EOF
          )" \
            --label "backmerge" || true
          exit 1
