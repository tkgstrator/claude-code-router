name: CI

on:
  pull_request:
  push:
    branches: [main, develop, master]

jobs:
  commitlint:
    name: Commit Lint
    if: github.event.action != 'closed' || github.event.pull_request.merged != true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install commitlint
        run: |
          bun install \
            commitlint@latest \
            @commitlint/config-conventional \
            conventional-changelog-conventionalcommits
      - name: Validate current commit (push)
        if: github.event_name == 'push'
        run: bunx commitlint --last --verbose
      - name: Validate PR commits
        if: github.event_name == 'pull_request'
        run: |
          bunx commitlint \
            --from ${{ github.event.pull_request.head.sha }}~${{ github.event.pull_request.commits }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose

  biome:
    name: Biome Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bunx @biomejs/biome check

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # The root tsconfig now also checks src/, which imports
      # @ccr/server -> @ccr/shared / @musistudio/llms. The exports map
      # types at ./dist/...d.ts on those packages, so dist has to exist
      # before tsc walks into them.
      - run: bun run build:shared && bun run build:core
      - run: bunx tsc -b --noEmit

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # __tests__/providers/* are live-API integration tests (need a
      # running CCR server + provider keys/credentials). CCR_SKIP_LIVE_TESTS
      # forces every provider describe to skip regardless of whether keys
      # or ~/.claude / ~/.codex credentials happen to be present, so the
      # whole __tests__ tree runs deterministically: providers skip,
      # preset unit tests pass. This also guards the skipIf wiring itself.
      - run: CCR_SKIP_LIVE_TESTS=1 bun test __tests__/

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
