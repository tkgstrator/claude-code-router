services:
  ccr:
    image: musistudio/claude-code-router:latest
    ports:
      - "127.0.0.1:3456:3456"
    volumes:
      - ${HOME}/.claude-code-router:/root/.claude-code-router
      - ${HOME}/.claude:/root/.claude
      - ${HOME}/.codex:/root/.codex
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
